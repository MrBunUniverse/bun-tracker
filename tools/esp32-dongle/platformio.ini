; SlimeVR USB dongle firmware for a classic ESP32 DevKit (CH340 USB chip).
; Build: pio run    Flash: pio run -t upload
; DONGLE_BAUD must match bridge.py --baud. On the CH340 board, 2000000 loses ~1% of frames but halves
; the USB delay versus 460800 (0% loss); 921600 fails completely. See README for the measurements.
[env:esp32dev]
; Stock espressif32 (Arduino 2.x) has no NAPT compiled in; pioarduino (Arduino 3.x) does, for flash mode.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32dev
framework = arduino
; 460800 corrupted a flash read on this board's CH340 cable, so flash at the safe speed.
upload_speed = 115200
monitor_speed = 460800
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DDONGLE_BAUD=2000000
	; Channel 1 had the fewest overlapping networks nearby (2026-10-17 scan); 6 was the busiest.
	-DDONGLE_CHANNEL=1
